<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacBox</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #f5f9ff; }
      body { display: grid; place-items: center; color: #334155; font: 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      main { text-align: center; }
      .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #dbeafe; border-top-color: #0ea5e9; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="spinner"></div>
      <div>正在启动 MacBox…</div>
    </main>
  </body>
</html>
