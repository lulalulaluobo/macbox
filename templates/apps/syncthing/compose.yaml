services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: macbox-syncthing
    restart: unless-stopped
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - /data/appdata/syncthing:/var/syncthing
      - /data/files:/var/syncthing/files
