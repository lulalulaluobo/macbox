services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: macnas-qbittorrent
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
    volumes:
      - /data/appdata/qbittorrent/config:/config
      - /data/downloads:/downloads
      - /data/media:/media
    ports:
      - "8085:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
