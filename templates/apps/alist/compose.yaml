services:
  alist:
    image: xhofe/alist:latest
    container_name: macbox-alist
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
    volumes:
      - /data/appdata/alist/data:/opt/alist/data
      - type: bind
        source: /data
        target: /data
        bind:
          propagation: rslave
    ports:
      - "5244:5244"
    restart: unless-stopped
